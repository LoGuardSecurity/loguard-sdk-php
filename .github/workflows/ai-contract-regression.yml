name: AI contract regression
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ai-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  LOGUARD_API_KEY: ''
  LOGGUARD_API_KEY: ''
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          tools: none
          coverage: none
      - name: Standalone AI and existing runtime contracts
        run: |
          php tests/Contract/ai_content_contract.php
          for test in packages/php-runtime/tests/Unit/*.php; do php "$test"; done
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, curl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test
