name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover
        required: true
        type: string

permissions:
  contents: write

jobs:
  standalone-release:
    name: Standalone release
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify package
        run: ./scripts/verify-package.sh

      - name: Build standalone archive
        run: ./scripts/build-standalone.sh "${{ steps.version.outputs.version }}"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          archive="dist/loguard-php-sdk-${version}.zip"
          checksum="${archive}.sha256"
          test -s "$archive"
          test -s "$checksum"
          sha256sum -c "$checksum"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          archive="dist/loguard-php-sdk-${version}.zip"
          checksum="${archive}.sha256"
          gh release create "$RELEASE_TAG" \
            "$archive" \
            "$checksum" \
            --verify-tag \
            --title "LoGuard PHP SDK $RELEASE_TAG" \
            --generate-notes
